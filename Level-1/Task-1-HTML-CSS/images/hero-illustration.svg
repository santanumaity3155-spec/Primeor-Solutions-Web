<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <!-- Background -->
  <rect width="520" height="400" rx="12" fill="#e0e7ff"/>

  <!-- Monitor -->
  <rect x="110" y="60" width="300" height="210" rx="10" fill="#1e293b"/>
  <rect x="120" y="70" width="280" height="185" rx="4" fill="#f8fafc"/>

  <!-- Screen content — code lines -->
  <rect x="140" y="95" width="120" height="8" rx="2" fill="#2563eb" opacity="0.7"/>
  <rect x="140" y="115" width="180" height="8" rx="2" fill="#94a3b8"/>
  <rect x="140" y="135" width="140" height="8" rx="2" fill="#94a3b8"/>
  <rect x="140" y="155" width="200" height="8" rx="2" fill="#2563eb" opacity="0.5"/>
  <rect x="140" y="175" width="100" height="8" rx="2" fill="#94a3b8"/>
  <rect x="140" y="195" width="160" height="8" rx="2" fill="#2563eb" opacity="0.6"/>
  <rect x="140" y="215" width="80" height="8" rx="2" fill="#94a3b8"/>

  <!-- Cursor indicator -->
  <circle cx="360" y="98" r="4" fill="#2563eb"/>

  <!-- Stand -->
  <rect x="230" y="270" width="60" height="30" rx="2" fill="#475569"/>
  <rect x="200" y="300" width="120" height="10" rx="4" fill="#475569"/>

  <!-- Decorative elements -->
  <circle cx="60" cy="100" r="24" fill="#2563eb" opacity="0.15"/>
  <circle cx="480" cy="80" r="18" fill="#2563eb" opacity="0.12"/>
  <circle cx="460" cy="340" r="30" fill="#2563eb" opacity="0.1"/>
  <circle cx="70" cy="320" r="20" fill="#2563eb" opacity="0.12"/>

  <!-- Floating shapes -->
  <rect x="30" y="180" width="30" height="30" rx="6" fill="#2563eb" opacity="0.18" transform="rotate(15 45 195)"/>
  <rect x="440" y="200" width="25" height="25" rx="5" fill="#2563eb" opacity="0.15" transform="rotate(-10 452 212)"/>

  <!-- Text label -->
  <text x="260" y="360" text-anchor="middle" font-family="Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600" fill="#475569">Web Development</text>
</svg>
